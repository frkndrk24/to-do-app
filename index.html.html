      color: #f0f0f0;
      overscroll-behavior: none;
    }
    #app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; }
    button { font-family: inherit; }
    input { font-family: inherit; }
    .header {
      padding: 48px 24px 24px;
      background: linear-gradient(180deg, rgba(110,231,183,0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .label { font-size: 11px; letter-spacing: 3px; color: #6EE7B7; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    .day-name { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .date-sub { font-size: 16px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .stats-btn {
      background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.3);
      color: #6EE7B7; border-radius: 12px; padding: 8px 16px; cursor: pointer;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
    }
    .stats-btn.active { background: #6EE7B7; color: #0a0a0a; }
    .progress-wrap { margin-top: 20px; }
    .progress-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .progress-label { font-size: 12px; color: rgba(255,255,255,0.5); }
    .progress-val { font-size: 12px; font-weight: 700; color: #6EE7B7; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6EE7B7, #93C5FD); border-radius: 3px; transition: width 0.5s ease; }
    .list-selector { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); position: relative; }
    .list-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; cursor: pointer; color: #f0f0f0;
      justify-content: space-between;
    }
    .list-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .list-name-text { font-weight: 600; font-size: 15px; }
    .dropdown {
      position: absolute; top: calc(100% - 4px); left: 24px; right: 24px; z-index: 100;
      background: #1a1a2e; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .dropdown-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.04); }
    .dropdown-item.active { background: rgba(110,231,183,0.1); }
    .dropdown-add {
      padding: 12px 16px; cursor: pointer; color: #6EE7B7; font-size: 13px;
      font-weight: 600; display: flex; align-items: center; gap: 8px;
    }
    .dropdown-add:hover { background: rgba(110,231,183,0.05); }
    .del-list-btn { background: transparent; border: none; color: rgba(255,100,100,0.5); cursor: pointer; font-size: 16px; padding: 0 4px; }
    .items-wrap { padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
    .empty-state { text-align: center; padding: 48px 0; color: rgba(255,255,255,0.2); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .item-row {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-radius: 14px; transition: all 0.3s ease;
    }
    .item-row.done { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); opacity: 0.45; }
    .item-row.todo { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
    @keyframes moveDown { 0% { transform: translateY(-10px); opacity: 1; } 100% { transform: translateY(0); opacity: 0.45; } }
    @keyframes moveUp { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .item-anim-down { animation: moveDown 0.45s cubic-bezier(0.34,1.1,0.64,1) forwards; }
    .item-anim-up { animation: moveUp 0.45s cubic-bezier(0.34,1.1,0.64,1) forwards; }
    .check-btn {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #0a0a0a; font-size: 13px; font-weight: 800; transition: all 0.2s;
      border: 2px solid rgba(255,255,255,0.2); background: transparent;
    }
    .check-btn.done { background: #6EE7B7; border-color: #6EE7B7; }
    .item-text { flex: 1; font-size: 14px; font-weight: 500; }
    .item-text.done { text-decoration: line-through; color: rgba(255,255,255,0.3); }
    .del-btn { background: transparent; border: none; color: rgba(255,80,80,0.3); cursor: pointer; font-size: 18px; padding: 0 2px; line-height: 1; }
    .edit-input {
      background: transparent; border: none; outline: 1px solid #6EE7B7;
      color: #f0f0f0; font-size: 14px; width: 100%; border-radius: 4px; padding: 2px 6px;
    }
    .fab {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      width: 56px; height: 56px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6EE7B7, #059669);
      color: #0a0a0a; font-size: 28px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(110,231,183,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .reset-notice {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: rgba(255,255,255,0.12); padding: 8px;
      letter-spacing: 1px; width: 100%; text-align: center;
    }
    .view-pad { padding: 32px 24px; }
    .view-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .field-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 8px; letter-spacing: 1px; }
    .text-input {
      width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      color: #f0f0f0; font-size: 15px; outline: none; margin-bottom: 24px;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn-cancel {
      flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 14px;
    }
    .btn-primary {
      flex: 2; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #6EE7B7, #059669); color: #0a0a0a;
      cursor: pointer; font-size: 14px; font-weight: 700;
    }
    .color-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; }
    .stats-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
    .toggle-btn {
      flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toggle-btn.active { background: #6EE7B7; color: #0a0a0a; border-color: #6EE7B7; }
    .today-card {
      background: rgba(110,231,183,0.08); border: 1px solid rgba(110,231,183,0.2);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
    }
    .today-row { display: flex; gap: 16px; }
    .today-cell { flex: 1; text-align: center; }
    .today-big { font-size: 32px; font-weight: 800; }
    .today-sub { font-size: 11px; color: rgba(255,255,255,0.4); }
    .chart-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; }
    .chart-bars { display: flex; gap: 8px; align-items: flex-end; height: 120px; margin-bottom: 8px; }
    .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .chart-pct { font-size: 10px; font-weight: 700; color: #6EE7B7; }
    .chart-bar { width: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #6EE7B7, #059669); transition: height 0.5s ease; }
    .chart-labels { display: flex; gap: 8px; }
    .chart-lbl { flex: 1; text-align: center; font-size: 9px; color: rgba(255,255,255,0.3); }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: rgba(255,255,255,0.03);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-rows { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="label">GÖREV TAKİPÇİSİ</div>
        <div class="day-name" id="dayName"></div>
        <div class="date-sub" id="dateSub"></div>
      </div>
      <button class="stats-btn" id="statsBtn" onclick="toggleStats()">📊 DURUM</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-row">
        <span class="progress-label">Bugünkü İlerleme</span>
        <span class="progress-val" id="progressVal">0/0 · %0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <div id="mainView">
    <!-- List selector -->
    <div class="list-selector">
      <button class="list-btn" onclick="toggleDropdown()">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="list-dot" id="activeDot"></div>
          <span class="list-name-text" id="activeListName">Yükleniyor...</span>
        </div>
        <span style="color:rgba(255,255,255,0.3);font-size:12px;" id="dropArrow">▼</span>
      </button>
      <div class="dropdown hidden" id="dropdown"></div>
    </div>
    <!-- Items -->
    <div class="items-wrap" id="itemsWrap"></div>
    <button class="fab" onclick="showView('addItem')">+</button>
    <div class="reset-notice">Her gün 06:00'da sıfırlanır</div>
  </div>

  <!-- ADD ITEM VIEW -->
  <div id="addItemView" class="hidden view-pad">
    <div class="view-title">Yeni Görev Ekle</div>
    <div class="field-label">GÖREV ADI</div>
    <input class="text-input" id="newItemInput" placeholder="Görevi buraya yaz..." onkeydown="if(event.key==='Enter')addItem()"/>
    <div class="btn-row">
      <button class="btn-cancel" onclick="showView('main')">İptal</button>
      <button class="btn-primary" onclick="addItem()">Ekle</button>
    </div>
  </div>

  <!-- ADD LIST VIEW -->
  <div id="addListView" class="hidden view-pad">
    <div class="view-title">Yeni Liste Oluştur</div>
    <div class="field-label">LİSTE ADI</div>
    <input class="text-input" id="newListInput" placeholder="Liste adı..."/>
    <div class="field-label">RENK SEÇ</div>
    <div class="color-row" id="colorRow"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="showView('main')">İptal</button>
      <button class="btn-primary" id="addListBtn" onclick="addList()">Oluştur</button>
    </div>
  </div>

  <!-- STATS VIEW -->
  <div id="statsView" class="hidden view-pad">
    <div class="stats-toggle">
      <button class="toggle-btn active" id="monthlyBtn" onclick="setStatsMode('monthly')">📅 Aylık</button>
      <button class="toggle-btn" id="yearlyBtn" onclick="setStatsMode('yearly')">📆 Yıllık</button>
    </div>
    <div class="today-card">
      <div class="label">BUGÜN</div>
      <div class="today-row">
        <div class="today-cell"><div class="today-big" id="todayPct" style="color:#6EE7B7">%0</div><div class="today-sub">Tamamlama</div></div>
        <div class="today-cell"><div class="today-big" id="todayDone">0</div><div class="today-sub">Tamamlanan</div></div>
        <div class="today-cell"><div class="today-big" id="todayTotal">0</div><div class="today-sub">Toplam</div></div>
      </div>
    </div>
    <div class="chart-card">
      <div class="field-label" id="chartTitle">SON 6 AY</div>
      <div class="chart-bars" id="chartBars"></div>
      <div class="chart-labels" id="chartLabels"></div>
    </div>
    <div class="stat-rows" id="statRows"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'todo_app_v1';
const HISTORY_KEY = 'todo_history_v1';
const COLORS = ['#6EE7B7','#93C5FD','#FCA5A5','#FDE68A','#C4B5FD','#FB923C','#F9A8D4','#A5F3FC'];

let data = null;
let history = {};
let currentView = 'main';
let statsMode = 'monthly';
let selectedColor = COLORS[0];
let editingId = null;
let dropdownOpen = false;

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function loadHistory() {
  try { const r = localStorage.getItem(HISTORY_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; }
}
function saveHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

function getDefaultData() {
  return { lists: [{id:'default', name:'Günlük Görevler', color:'#6EE7B7'}], activeListId:'default', items:{}, lastReset: getTodayKey() };
}

function shouldReset(lastReset) {
  const todayStr = getTodayKey();
  if (lastReset === todayStr) return false;
  const now = new Date();
  if (now.getHours() >= 6) return true;
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  return lastReset !== yKey;
}

function init() {
  data = loadData();
  history = loadHistory();
  if (!data) data = getDefaultData();

  if (shouldReset(data.lastReset)) {
    const todayKey = getTodayKey();
    Object.keys(data.items).forEach(listId => {
      const items = data.items[listId] || [];
      if (items.length > 0) {
        if (!history[listId]) history[listId] = {};
        history[listId][todayKey] = { total: items.length, completed: items.filter(i=>i.done).length };
      }
    });
    Object.keys(data.items).forEach(listId => {
      data.items[listId] = (data.items[listId]||[]).map(item => ({...item, done:false}));
    });
    data.lastReset = todayKey;
    saveData(); saveHistory();
  }

  setDates();
  renderAll();
}

function setDates() {
  const now = new Date();
  document.getElementById('dayName').textContent = now.toLocaleDateString('tr-TR', {weekday:'long'}) + ',';
  document.getElementById('dateSub').textContent = now.toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
}

function getActiveItems() { return data.items[data.activeListId] || []; }
function getActiveList() { return data.lists.find(l => l.id === data.activeListId); }

function renderAll() {
  renderProgress();
  renderListSelector();
  renderItems();
}

function renderProgress() {
  const items = getActiveItems();
  const done = items.filter(i=>i.done).length;
  const total = items.length;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('progressVal').textContent = `${done}/${total} · %${pct}`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('todayPct').textContent = '%' + pct;
  document.getElementById('todayDone').textContent = done;
  document.getElementById('todayTotal').textContent = total;
}

function renderListSelector() {
  const list = getActiveList();
  if (!list) return;
  document.getElementById('activeDot').style.background = list.color;
  document.getElementById('activeListName').textContent = list.name;
  renderDropdown();
}

function renderDropdown() {
  const dd = document.getElementById('dropdown');
  dd.innerHTML = '';
  data.lists.forEach(list => {
    const div = document.createElement('div');
    div.className = 'dropdown-item' + (list.id === data.activeListId ? ' active' : '');
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="list-dot" style="background:${list.color}"></div>
        <span style="font-size:14px;font-weight:${list.id===data.activeListId?700:400}">${list.name}</span>
        <span style="font-size:11px;color:rgba(255,255,255,0.3)">${(data.items[list.id]||[]).length} madde</span>
      </div>
    `;
    if (data.lists.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.className = 'del-list-btn'; delBtn.textContent = '×';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteList(list.id); };
      div.appendChild(delBtn);
    }
    div.onclick = () => { data.activeListId = list.id; saveData(); closeDropdown(); renderAll(); };
    dd.appendChild(div);
  });
  const addDiv = document.createElement('div');
  addDiv.className = 'dropdown-add';
  addDiv.innerHTML = '<span>＋</span> Yeni Liste Oluştur';
  addDiv.onclick = () => { closeDropdown(); showView('addList'); };
  dd.appendChild(addDiv);
}

function renderItems() {
  const wrap = document.getElementById('itemsWrap');
  const items = getActiveItems();
  wrap.innerHTML = '';
  if (items.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">✓</div><div style="font-size:14px">Henüz görev yok</div><div style="font-size:12px;margin-top:4px">Aşağıdaki + butonuna basarak ekle</div></div>`;
    return;
  }
  const sorted = [...items].sort((a, b) => {
    if (a.done === b.done) return 0;
    return a.done ? 1 : -1;
  });
  sorted.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row ' + (item.done ? 'done' : 'todo'); row.dataset.id = item.id;
    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn' + (item.done ? ' done' : '');
    checkBtn.textContent = item.done ? '✓' : '';
    checkBtn.onclick = () => toggleItem(item.id);

    const textSpan = document.createElement('span');
    textSpan.className = 'item-text' + (item.done ? ' done' : '');
    if (editingId === item.id) {
      const inp = document.createElement('input');
      inp.className = 'edit-input'; inp.value = item.text;
      inp.onblur = () => saveEdit(item.id, inp.value);
      inp.onkeydown = (e) => { if(e.key==='Enter') saveEdit(item.id, inp.value); if(e.key==='Escape'){editingId=null;renderItems();} };
      setTimeout(() => inp.focus(), 50);
      textSpan.appendChild(inp);
    } else {
      textSpan.textContent = item.text;
      textSpan.ondblclick = () => { editingId = item.id; renderItems(); };
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn'; delBtn.textContent = '×';
    delBtn.onclick = () => deleteItem(item.id);

    row.appendChild(checkBtn); row.appendChild(textSpan); row.appendChild(delBtn);
    wrap.appendChild(row);
  });
}

function toggleItem(id) {
  const item = getActiveItems().find(i => i.id === id);
  if (!item) return;
  const willBeDone = !item.done;

  // Get current DOM rows and their order
  const wrap = document.getElementById('itemsWrap');
  const rows = Array.from(wrap.querySelectorAll('.item-row'));
  const positions = {};
  rows.forEach(r => {
    positions[r.dataset.id] = r.getBoundingClientRect().top;
  });

  // Update data
  const items = getActiveItems().map(i => i.id===id ? {...i, done:!i.done} : i);
  data.items[data.activeListId] = items;
  saveData();
  renderProgress();

  // Re-render items without animation first
  renderItemsNoAnim();

  // Now animate moved items
  const newRows = Array.from(wrap.querySelectorAll('.item-row'));
  newRows.forEach(r => {
    const rid = r.dataset.id;
    if (positions[rid] !== undefined) {
      const newTop = r.getBoundingClientRect().top;
      const diff = positions[rid] - newTop;
      if (Math.abs(diff) > 5) {
        r.style.transform = `translateY(${diff}px)`;
        r.style.transition = 'none';
        requestAnimationFrame(() => {
          r.style.transition = 'transform 0.45s cubic-bezier(0.34,1.1,0.64,1), opacity 0.3s ease';
          r.style.transform = 'translateY(0)';
        });
      }
    }
  });
}

function renderItemsNoAnim() {
  renderItems();
}

function deleteItem(id) {
  data.items[data.activeListId] = getActiveItems().filter(i => i.id !== id);
  saveData(); renderAll();
}

function saveEdit(id, text) {
  if (!text.trim()) return;
  data.items[data.activeListId] = getActiveItems().map(i => i.id===id ? {...i, text:text.trim()} : i);
  editingId = null; saveData(); renderItems();
}

function addItem() {
  const input = document.getElementById('newItemInput');
  const text = input.value.trim();
  if (!text) return;
  if (!data.items[data.activeListId]) data.items[data.activeListId] = [];
  data.items[data.activeListId].push({ id: Date.now().toString(), text, done: false });
  saveData(); input.value = ''; showView('main');
}

function deleteList(id) {
  if (data.lists.length <= 1) return;
  data.lists = data.lists.filter(l => l.id !== id);
  delete data.items[id];
  if (data.activeListId === id) data.activeListId = data.lists[0].id;
  saveData(); renderAll();
}

function addList() {
  const name = document.getElementById('newListInput').value.trim();
  if (!name) return;
  const id = Date.now().toString();
  data.lists.push({ id, name, color: selectedColor });
  data.items[id] = [];
  data.activeListId = id;
  saveData();
  document.getElementById('newListInput').value = '';
  showView('main');
}

function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  const dd = document.getElementById('dropdown');
  const arrow = document.getElementById('dropArrow');
  dd.classList.toggle('hidden', !dropdownOpen);
  arrow.textContent = dropdownOpen ? '▲' : '▼';
}

function closeDropdown() {
  dropdownOpen = false;
  document.getElementById('dropdown').classList.add('hidden');
  document.getElementById('dropArrow').textContent = '▼';
}

function showView(v) {
  currentView = v;
  document.getElementById('mainView').classList.toggle('hidden', v !== 'main');
  document.getElementById('addItemView').classList.toggle('hidden', v !== 'addItem');
  document.getElementById('addListView').classList.toggle('hidden', v !== 'addList');
  document.getElementById('statsView').classList.toggle('hidden', v !== 'stats');
  document.getElementById('progressWrap').classList.toggle('hidden', v === 'stats');
  document.getElementById('statsBtn').classList.toggle('active', v === 'stats');
  if (v === 'addItem') setTimeout(() => document.getElementById('newItemInput').focus(), 100);
  if (v === 'addList') { renderColorPicker(); setTimeout(() => document.getElementById('newListInput').focus(), 100); }
  if (v === 'stats') renderStats();
  closeDropdown();
}

function toggleStats() {
  if (currentView === 'stats') showView('main');
  else showView('stats');
}

function renderColorPicker() {
  const row = document.getElementById('colorRow');
  row.innerHTML = '';
  COLORS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'color-swatch';
    btn.style.background = c;
    btn.style.outline = c === selectedColor ? '3px solid white' : 'none';
    btn.style.outlineOffset = '2px';
    btn.onclick = () => { selectedColor = c; document.getElementById('addListBtn').style.background = `linear-gradient(135deg,${c},${c}99)`; renderColorPicker(); };
    row.appendChild(btn);
  });
  document.getElementById('addListBtn').style.background = `linear-gradient(135deg,${selectedColor},${selectedColor}99)`;
}

function setStatsMode(mode) {
  statsMode = mode;
  document.getElementById('monthlyBtn').classList.toggle('active', mode==='monthly');
  document.getElementById('yearlyBtn').classList.toggle('active', mode==='yearly');
  renderStats();
}

function renderStats() {
  renderProgress();
  const allHistory = JSON.parse(JSON.stringify(history));
  const todayKey = getTodayKey();
  Object.keys(data.items).forEach(listId => {
    const items = data.items[listId] || [];
    if (items.length > 0) {
      if (!allHistory[listId]) allHistory[listId] = {};
      allHistory[listId][todayKey] = { total: items.length, completed: items.filter(i=>i.done).length };
    }
  });

  const now = new Date();
  const results = [];

  if (statsMode === 'monthly') {
    document.getElementById('chartTitle').textContent = 'SON 6 AY';
    for (let i=5; i>=0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const label = d.toLocaleString('tr-TR', {month:'short', year:'2-digit'});
      let total=0, completed=0;
      Object.keys(allHistory).forEach(lid => {
        Object.keys(allHistory[lid]||{}).forEach(dk => {
          if (dk.startsWith(monthKey)) { total += allHistory[lid][dk].total||0; completed += allHistory[lid][dk].completed||0; }
        });
      });
      results.push({ label, total, completed, pct: total>0 ? Math.round((completed/total)*100) : 0 });
    }
  } else {
    document.getElementById('chartTitle').textContent = 'SON 3 YIL';
    for (let i=2; i>=0; i--) {
      const year = now.getFullYear()-i;
      const label = String(year);
      let total=0, completed=0;
      Object.keys(allHistory).forEach(lid => {
        Object.keys(allHistory[lid]||{}).forEach(dk => {
          if (dk.startsWith(label)) { total += allHistory[lid][dk].total||0; completed += allHistory[lid][dk].completed||0; }
        });
      });
      results.push({ label, total, completed, pct: total>0 ? Math.round((completed/total)*100) : 0 });
    }
  }

  const barsEl = document.getElementById('chartBars');
  const labelsEl = document.getElementById('chartLabels');
  barsEl.innerHTML = ''; labelsEl.innerHTML = '';
  results.forEach(r => {
    const col = document.createElement('div'); col.className = 'chart-col';
    const pctEl = document.createElement('div'); pctEl.className = 'chart-pct'; pctEl.textContent = r.pct>0 ? `%${r.pct}` : '';
    const bar = document.createElement('div'); bar.className = 'chart-bar';
    bar.style.height = Math.max((r.pct/100)*90, r.total>0 ? 4 : 0) + 'px';
    bar.style.opacity = r.total>0 ? 1 : 0.2;
    col.appendChild(pctEl); col.appendChild(bar); barsEl.appendChild(col);
    const lbl = document.createElement('div'); lbl.className = 'chart-lbl'; lbl.textContent = r.label;
    labelsEl.appendChild(lbl);
  });

  const rowsEl = document.getElementById('statRows'); rowsEl.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div'); div.className = 'stat-row';
    div.innerHTML = `<span style="font-size:13px;font-weight:600">${r.label}</span><div style="display:flex;gap:16px;font-size:12px"><span style="color:rgba(255,255,255,0.4)">${r.completed}/${r.total} görev</span><span style="color:#6EE7B7;font-weight:700">%${r.pct}</span></div>`;
    rowsEl.appendChild(div);
  });
}

document.addEventListener('click', (e) => {
  if (dropdownOpen && !e.target.closest('.list-selector')) closeDropdown();
});

init();
</script>
